name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 依存関係をインストール
        run: pip install -r requirements-dev.txt

      - name: Python 版のテスト
        run: python -m pytest -q

      - name: JS 版 点数計算エンジンのテスト
        run: node --test webapp/tests/engine.test.mjs

      # JS 版の画像認識は Python 版と同じ画素で検証する。
      # 両実装が食い違ったらここで落ちる。
      - name: 検証用の生画像を書き出す
        run: python tools/export_raw_samples.py /tmp/mj-raw

      - name: JS 版 画像認識のテスト
        run: MJ_RAW_DIR=/tmp/mj-raw node --test webapp/tests/vision.test.mjs

      - name: 認識精度の計測
        run: python tools/eval_vision.py --library
